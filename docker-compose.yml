services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: workflow-api
    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - .:/app
      - /app/node_modules

    # The bind mount provides source code at runtime, so generate Prisma Client
    # in the container's node_modules volume before starting the watcher.
    command: sh -c "npm run prisma:generate && npm run dev"

  postgres:
    image: postgres:17-alpine
    container_name: workflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_engine
    # Host port 5434: local Windows PostgreSQL owns 5432 and other
    # project containers occupy 5433.
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: workflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data:
